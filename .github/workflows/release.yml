# Go modules publish by tag: on a vX.Y.Z tag this tests the tagged code and asks the Go proxy to fetch it.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    container: golang:1.27

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The tag must match the Version constant, so the User-Agent never lies.
      - name: Check the tag matches the version
        run: |
          code_version="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          if [ "$code_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version $code_version" >&2
            exit 1
          fi

      - run: go test -race -count=1 ./...

      # The proxy then serves the version at once, and pkg.go.dev picks it up.
      - name: Warm the Go module proxy
        run: |
          cd "$(mktemp -d)"
          GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
