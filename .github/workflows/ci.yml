# Runs vet, the race-enabled tests and govulncheck on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.25", "1.27"]

    # The official image is the toolchain, so nothing is installed on the runner.
    container: golang:${{ matrix.go-version }}

    env:
      GOTOOLCHAIN: local

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    container: golang:1.27

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - run: govulncheck ./...
